<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>チャットリプレイプレーヤー</title>
</head>
<body>
<div id="app">
  <header class="bar">
    <button id="pick" type="button">ファイルを選択</button>
    <div id="status" aria-live="polite"></div>
  </header>
  <div id="video-wrap"><video id="video" playsinline preload="metadata"></video></div>
  <div id="controls"></div>
  <div id="chat-note" aria-live="polite"></div>
  <div id="chat" role="log" aria-label="チャット"></div>
</div>
<input id="file-input" type="file" multiple hidden>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
